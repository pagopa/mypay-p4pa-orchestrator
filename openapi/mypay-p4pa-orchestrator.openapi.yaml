openapi: 3.1.0
info:
  title: MyPay P4PA Orchestrator API
  description: API for orchestrating MyPay4 data migrations to Piattaforma Unitaria.
  version: "1.0.0"
tags:
  - name: OrchestrateMigration
    description: Migration orchestration APIs
paths:
  /orchestrate/migrate:
    post:
      tags:
        - OrchestrateMigration
      operationId: orchestrateMigration
      summary: Start a migration orchestration
      description: |-
        Start an EXPORT, TRANSFER or ALL migration flow.
        EXPORT and ALL requests require non-empty ipaCodes and fileTypesToInclude, and a cycleMode.
        TRANSFER requests require migrationId.
        FULL cycle mode requires period; REJECTS_ONLY cycle mode requires rejectsPayload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationRequestDto'
      responses:
        '202':
          description: Migration orchestration accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationResponseDto'
        '400':
          description: Invalid migration request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '409':
          description: Migration conflicts with an existing operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
components:
  schemas:
    MigrationRequestDto:
      type: object
      required:
        - phase
        - cycleMode
      properties:
        phase:
          $ref: '#/components/schemas/MigrationPhase'
        ipaCodes:
          type: array
          description: Required and non-empty for EXPORT and ALL phases
          items:
            type: string
        cycleMode:
          allOf:
            - $ref: '#/components/schemas/CycleMode'
          description: Required for all migration phases
        fileTypesToInclude:
          type: array
          description: Required and non-empty for EXPORT and ALL phases
          items:
            type: 'MigrationFileType'
        period:
          allOf:
            - $ref: '#/components/schemas/PeriodDto'
          description: Required when cycleMode is FULL
        migrationId:
          type: string
          format: uuid
          description: Required for TRANSFER phase
        logicalKey:
          type: string
        rejectsPayload:
          type:
            - array
            - "null"
          items:
            type: string
          description: Required when cycleMode is REJECTS_ONLY; an array of strings
    PeriodDto:
      type: object
      properties:
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
    MigrationResponseDto:
      type: object
      properties:
        migrationId:
          type: string
          format: uuid
        phase:
          $ref: '#/components/schemas/MigrationPhase'
        status:
          $ref: '#/components/schemas/MigrationExecutionStatus'
        cycleMode:
          $ref: '#/components/schemas/CycleMode'
        ipaCodes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        uploadIds:
          type: array
          items:
            type: string
          description: Upload identifiers, populated only for TRANSFER migrations
    MigrationPhase:
      type: string
      enum:
        - EXPORT
        - TRANSFER
        - ALL
    CycleMode:
      type: string
      enum:
        - FULL
        - DELTA
        - REJECTS_ONLY
    MigrationExecutionStatus:
      type: string
      enum:
        - PENDING
        - EXTRACTING
        - EXTRACTED
        - UPLOADING
        - WAITING_PU
        - COMPLETED
        - PARTIAL
        - FAILED
    ErrorDTO:
      type: object
      required:
        - category
        - code
        - message
      properties:
        category:
          type: string
          enum:
            - NOT_FOUND
            - BAD_REQUEST
            - GENERIC_ERROR
            - TOO_MANY_REQUESTS
            - CONFLICT
            - FORBIDDEN
            - UNAUTHORIZED
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
