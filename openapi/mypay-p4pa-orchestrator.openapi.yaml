openapi: 3.1.0
info:
  title: MyPay P4PA Orchestrator API
  description: API for orchestrating MyPay4 data migrations to Piattaforma Unitaria.
  version: "1.0.0"
tags:
  - name: OrchestrateMigration
    description: Migration orchestration APIs
paths:
  /orchestrate/migrate:
    post:
      tags:
        - OrchestrateMigration
      operationId: orchestrateMigration
      summary: Start a migration orchestration
      description: |-
        Start an EXPORT, TRANSFER or COMPLETE migration action.
        EXPORT and COMPLETE actions require non-empty ipaCodes and fileTypesToInclude; all actions require orchestrationMode.
        TRANSFER actions require migrationId for an existing completed EXPORT migration and do not support REJECTS_ONLY mode.
        For REJECTS_ONLY EXPORT and COMPLETE actions, migrationId identifies the previous migration; rejected records are assembled by the orchestrator.
        FULL mode requires period for EXPORT and COMPLETE actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationRequestDto'
      responses:
        '202':
          description: Migration orchestration accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationResponseDto'
        '400':
          description: Invalid migration request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '409':
          description: Migration conflicts with an existing operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /orchestrate/migrate/{migration_id}:
    get:
      tags:
        - OrchestrateMigration
      operationId: getMigrationStatus
      summary: Get migration orchestration status
      description: >-
        Returns the single migration status and persisted file execution details. The status is not
        split into separate export and transfer statuses.
      parameters:
        - name: migration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Migration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationStatusDto'
        '404':
          description: Migration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /orchestrate/migrate/{migration_id}/export/file-status/{fileType}:
    get:
      tags:
        - OrchestrateMigration
      operationId: getExportFileStatus
      summary: Get persisted export status for a file type
      description: >-
        Returns extraction fields and row totals aggregated from migration file execution detail
        records.
      parameters:
        - name: migration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: fileType
          in: path
          required: true
          schema:
            type: MigrationFileType
      responses:
        '200':
          description: Export file status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportFileStatusDto'
        '404':
          description: Migration or file execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /orchestrate/migrate/{migration_id}/transfer/file-status/{fileType}:
    get:
      tags:
        - OrchestrateMigration
      operationId: getTransferFileStatus
      summary: Get persisted transfer status for a file type
      description: >-
        Returns upload fields and accepted/rejected row totals aggregated from migration file
        execution detail records.
      parameters:
        - name: migration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: fileType
          in: path
          required: true
          schema:
            type: MigrationFileType
      responses:
        '200':
          description: Transfer file status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferFileStatusDto'
        '404':
          description: Migration or file execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
components:
  schemas:
    MigrationRequestDto:
      type: object
      required:
        - action
        - orchestrationMode
      properties:
        action:
          $ref: '#/components/schemas/MigrationAction'
        ipaCodes:
          description: Required and non-empty for EXPORT and COMPLETE actions
          type: array
          items:
            type: string
        orchestrationMode:
          description: Required for all migration actions; REJECTS_ONLY is not supported for TRANSFER
          $ref: '#/components/schemas/OrchestrationMode'
        fileTypesToInclude:
          description: Required and non-empty for EXPORT and COMPLETE actions
          type: array
          items:
            type: 'MigrationFileType'
        period:
          description: Required when orchestrationMode is FULL for EXPORT and COMPLETE actions
          $ref: '#/components/schemas/PeriodDto'
        migrationId:
          description: For TRANSFER, must identify an existing completed EXPORT migration; for REJECTS_ONLY EXPORT and COMPLETE, identifies the previous migration
          type: string
          format: uuid
        logicalKey:
          type: string
    PeriodDto:
      type: object
      properties:
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
    MigrationResponseDto:
      type: object
      properties:
        migrationId:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/MigrationAction'
        status:
          $ref: '#/components/schemas/MigrationExecutionStatus'
        orchestrationMode:
          $ref: '#/components/schemas/OrchestrationMode'
        ipaCodes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        uploadIds:
          description: Upload identifiers, populated only for TRANSFER actions
          type: array
          items:
            type: string
    MigrationStatusDto:
      type: object
      required:
        - migrationId
        - action
        - status
        - orchestrationMode
        - ipaCodes
        - exportPhase
        - transferPhase
      properties:
        migrationId:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/MigrationAction'
        status:
          $ref: '#/components/schemas/MigrationExecutionStatus'
        orchestrationMode:
          $ref: '#/components/schemas/OrchestrationMode'
        ipaCodes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        errorCode:
          type: string
        errorMsg:
          type: string
        exportPhase:
          $ref: '#/components/schemas/MigrationExportPhaseDto'
        transferPhase:
          $ref: '#/components/schemas/MigrationTransferPhaseDto'
    MigrationExportPhaseDto:
      type: object
      description: Export file details; the phase status mirrors the single migration status.
      required:
        - status
        - files
      properties:
        status:
          $ref: '#/components/schemas/MigrationExecutionStatus'
        files:
          type: array
          items:
            $ref: '#/components/schemas/ExportFileStatusDto'
    MigrationTransferPhaseDto:
      type: object
      description: Transfer file details; the phase status mirrors the single migration status.
      required:
        - status
        - files
      properties:
        status:
          $ref: '#/components/schemas/MigrationExecutionStatus'
        files:
          type: array
          items:
            $ref: '#/components/schemas/TransferFileStatusDto'
    ExportFileStatusDto:
      type: object
      description: Persisted extraction fields and totals from associated file execution details.
      required:
        - fileType
        - status
      properties:
        fileType:
          type: MigrationFileType
        status:
          description: Current shared file execution status
          $ref: '#/components/schemas/MigrationFileExecutionStatus'
        extractionId:
          type: string
        filePath:
          type: string
        recordCount:
          description: Sum of numTotalRows over this file execution's detail records
          type: integer
          format: int64
        errorCode:
          type: string
        errorMsg:
          type: string
        extractionStartedAt:
          type: string
          format: date-time
        extractedAt:
          type: string
          format: date-time
    TransferFileStatusDto:
      type: object
      description: Persisted upload fields and accepted/rejected totals from associated file execution details.
      required:
        - fileType
        - status
      properties:
        fileType:
          type: MigrationFileType
        status:
          description: Current shared file execution status
          $ref: '#/components/schemas/MigrationFileExecutionStatus'
        uploadId:
          type: integer
          format: int64
        uploadStatus:
          type: string
        recordsAccepted:
          description: Sum of numCorrectlyImportedRows over this file execution's detail records
          type: integer
          format: int64
        recordsRejected:
          description: Sum of numTotalRows minus numCorrectlyImportedRows over detail records
          type: integer
          format: int64
        errorCode:
          type: string
        errorMsg:
          type: string
        uploadedAt:
          type: string
          format: date-time
        evidenceCollectedAt:
          description: Latest updateDate among terminal migration file execution details (COMPLETED, PARTIAL, FAILED)
          type: string
          format: date-time
    MigrationAction:
      type: string
      enum:
        - EXPORT
        - TRANSFER
        - COMPLETE
    OrchestrationMode:
      type: string
      enum:
        - FULL
        - DELTA
        - REJECTS_ONLY
    MigrationExecutionStatus:
      type: string
      enum:
        - RUNNING
        - COMPLETED
        - FAILED
        - WARNING
    MigrationFileExecutionStatus:
      type: string
      enum:
        - PENDING
        - EXPORTING
        - EXPORTED
        - TRANSFERING
        - WAITING_PU
        - COMPLETED
        - WARNING
        - FAILED
    MigrationFileExecutionDetailStatus:
      type: string
      enum:
        - PENDING
        - EXPORTED
        - TRANSFERING
        - WAITING_PU
        - COMPLETED
        - PARTIAL
        - FAILED
    ErrorDTO:
      type: object
      required:
        - category
        - code
        - message
      properties:
        category:
          type: string
          enum:
            - NOT_FOUND
            - BAD_REQUEST
            - GENERIC_ERROR
            - TOO_MANY_REQUESTS
            - CONFLICT
            - FORBIDDEN
            - UNAUTHORIZED
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
