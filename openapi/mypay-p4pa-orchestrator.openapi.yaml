openapi: 3.1.0
info:
  title: MyPay P4PA Orchestrator API
  description: API for orchestrating MyPay4 data migrations to Piattaforma Unitaria.
  version: "1.0.0"
tags:
  - name: OrchestrateMigration
    description: Migration orchestration APIs
paths:
  /orchestrate/migrate:
    post:
      tags:
        - OrchestrateMigration
      operationId: orchestrateMigration
      summary: Start a migration orchestration
      description: |-
        Start an EXPORT, TRANSFER or COMPLETE migration action.
        EXPORT and COMPLETE actions require non-empty ipaCodes and fileTypesToInclude; all actions require orchestationMode.
        TRANSFER actions require migrationId.
        FULL orchestrator mode requires period; REJECTS_ONLY orchestrator mode requires rejectsPayload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationRequestDto'
      responses:
        '202':
          description: Migration orchestration accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationResponseDto'
        '400':
          description: Invalid migration request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '409':
          description: Migration conflicts with an existing operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
components:
  schemas:
    MigrationRequestDto:
      type: object
      required:
        - action
        - orchestationMode
      properties:
        action:
          $ref: '#/components/schemas/MigrationAction'
        ipaCodes:
          description: Required and non-empty for EXPORT and COMPLETE actions
          type: array
          items:
            type: string
        orchestationMode:
          description: Required for all migration actions
          $ref: '#/components/schemas/CycleMode'
        fileTypesToInclude:
          description: Required and non-empty for EXPORT and COMPLETE actions
          type: array
          items:
            type: 'MigrationFileType'
        period:
          description: Required when orchestationMode is FULL
          $ref: '#/components/schemas/PeriodDto'
        migrationId:
          description: Required for TRANSFER action
          type: string
          format: uuid
        logicalKey:
          type: string
        rejectsPayload:
          description: Required when orchestationMode is REJECTS_ONLY; an array of strings
          type: array
          items:
            type: string
    PeriodDto:
      type: object
      properties:
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
    MigrationResponseDto:
      type: object
      properties:
        migrationId:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/MigrationAction'
        status:
          $ref: '#/components/schemas/MigrationExecutionStatus'
        orchestationMode:
          $ref: '#/components/schemas/CycleMode'
        ipaCodes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        uploadIds:
          description: Upload identifiers, populated only for TRANSFER actions
          type: array
          items:
            type: string
    MigrationAction:
      type: string
      enum:
        - EXPORT
        - TRANSFER
        - COMPLETE
    CycleMode:
      type: string
      enum:
        - FULL
        - DELTA
        - REJECTS_ONLY
    MigrationExecutionStatus:
      type: string
      enum:
        - RUNNING
        - COMPLETED
        - FAILED
        - WARNING
    ErrorDTO:
      type: object
      required:
        - category
        - code
        - message
      properties:
        category:
          type: string
          enum:
            - NOT_FOUND
            - BAD_REQUEST
            - GENERIC_ERROR
            - TOO_MANY_REQUESTS
            - CONFLICT
            - FORBIDDEN
            - UNAUTHORIZED
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
