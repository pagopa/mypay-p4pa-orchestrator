server:
  http: "\${SERVER_PORT:8080}"

spring:
  application:
    name: ${artifactId}
    version: ${version}
  jmx.enabled: true
  threads:
    virtual:
      enabled: true
  jpa:
    show-sql: "\${SHOW_SQL:false}"
    hibernate:
      ddl-auto: none
  datasource:
    url: "\${ORCHESTRATOR_DB_URL:jdbc:postgresql://\${ORCHESTRATOR_DB_HOST:localhost}:\${ORCHESTRATOR_DB_PORT:5432}/\${ORCHESTRATOR_DB_NAME:orchestrator_migration_toolkit}?currentSchema=orchestrator}"
    username: "\${ORCHESTRATOR_DB_USER}"
    password: "\${ORCHESTRATOR_DB_PASSWORD}"
    driverClassName: org.postgresql.Driver
    idle-timeout: "\${ORCHESTRATOR_DB_CONNECTION_IDLE_TIMEOUT_MILLISECONDS:600000}"
    connection-timeout: "\${ORCHESTRATOR_DB_CONNECTION_TIMEOUT_MILLISECONDS:30000}"
    keepalive-time: "\${ORCHESTRATOR_DB_CONNECTION_KEEPALIVE_TIME_MILLISECONDS:120000}"
    max-lifetime: "\${ORCHESTRATOR_DB_CONNECTION_MAX_LIFETIME_MILLISECONDS:1800000}"
    maximum-pool-size: "\${ORCHESTRATOR_DB_CONNECTION_MAX_POOL_SIZE:10}"
    minimum-idle: "\${ORCHESTRATOR_DB_CONNECTION_MIN_IDLE:10}"
management:
  info:
    build.enabled: true
    java.enabled: true
    git.enabled: true
  otlp.metrics.export.enabled: "\${TRACING_EXPORT:false}"
  tracing:
    sampling.probability: "\${TRACING_SAMPLING_PROBABILITY:1.0}"
  observations:
    http.server:
      filter.order: -100
  endpoints:
    jmx:
      exposure.include: "*"
    web:
      exposure:
        include: health, info, prometheus, metrics
      base-path: /actuator
  endpoint:
    health:
      probes.enabled: true
      logging.slow-indicator-threshold: "\${HEALTH_ACTUATOR_LOGGER_TIMEOUT_DURATION:PT1S}"
      show-details: "\${HEALTH_ACTUATOR_SHOW_DETAILS:when-authorized}"
      group:
        readiness.include: "*"
        liveness.include: livenessState,diskSpace,ping
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${artifactId}
    export:
      prometheus:
        enabled: true
        step: 1m
        descriptions: true
    enable:
      jvm: true
      process: true
      system: true
      http: true
      logback: true

logging:
  level:
    root: "\${LOG_LEVEL_ROOT:INFO}"
    it.gov.pagopa: "\${LOG_LEVEL_PAGOPA:INFO}"
    org.springframework: "\${LOG_LEVEL_SPRING:INFO}"
    org.springframework.boot.availability: "\${LOG_LEVEL_SPRING_BOOT_AVAILABILITY:DEBUG}"
    it.gov.pagopa.mypay2pu.orchestrator.exception.ControllerExceptionHandler: "\${LOGGING_LEVEL_API_REQUEST_EXCEPTION:INFO}"
    org.springdoc.core.utils.SpringDocAnnotationsUtils: "\${LOG_LEVEL_SPRING_DOC:ERROR}"
    PERFORMANCE_LOG: "\${LOG_LEVEL_PERFORMANCE_LOG:INFO}"
    PERFORMANCE_LOG.API_REQUEST: "\${LOG_LEVEL_PERFORMANCE_LOG_API_REQUEST:\${logging.level.PERFORMANCE_LOG}}"
    PERFORMANCE_LOG.REST_INVOKE: "\${LOG_LEVEL_PERFORMANCE_LOG_REST_INVOKE:\${logging.level.PERFORMANCE_LOG}}"

rest:
  defaults:
    connection-pool:
      size: "\${DEFAULT_REST_CONNECTION_POOL_SIZE:10}"
      size-per-route: "\${DEFAULT_REST_CONNECTION_POOL_SIZE_PER_ROUTE:5}"
      time-to-live-minutes: "\${DEFAULT_REST_CONNECTION_POOL_TIME_TO_LIVE_MINUTES:10}"
    timeout:
      connect-millis: "\${DEFAULT_REST_TIMEOUT_CONNECT_MILLIS:120000}"
      read-millis: "\${DEFAULT_REST_TIMEOUT_READ_MILLIS:120000}"
  extractor:
    base-url: "\${EXTRACTOR_BASE_URL:}"
    max-attempts: "\${EXTRACTOR_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${EXTRACTOR_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${EXTRACTOR_PRINT_BODY_WHEN_ERROR:true}"
  pu:
    auth:
      base-url: "\${PU_AUTH_BASE_URL:\${PU_BASE_URL:}/pu/auth}"
      max-attempts: "\${PU_AUTH_MAX_ATTEMPTS:3}" # It's counting also the first attempt
      wait-time-millis: "\${PU_AUTH_WAIT_TIME_MILLIS:500}"
      print-body-when-error: "\${PU_AUTH_PRINT_BODY_WHEN_ERROR:true}"
      post-token:
        client-id: "\${PU_AUTH_CLIENT_ID:clientid}"
        client-secret: "\${PU_AUTH_CLIENT_SECRET:clientsecret}"
    migration:
      base-url: "\${PU_MIGRATION_BASE_URL:\${PU_BASE_URL:}/pu/migration}"
      max-attempts: "\${PU_MIGRATION_MAX_ATTEMPTS:3}" # It's counting also the first attempt
      wait-time-millis: "\${PU_MIGRATION_WAIT_TIME_MILLIS:500}"
      print-body-when-error: "\${PU_MIGRATION_PRINT_BODY_WHEN_ERROR:true}"

datasource:
  orchestrator:
    jdbc-url: "\${ORCHESTRATOR_DB_URL:jdbc:postgresql://\${ORCHESTRATOR_DB_HOST:}:\${ORCHESTRATOR_DB_PORT:5432}/\${ORCHESTRATOR_DB_NAME:}}?currentSchema=orchestrator"
    username: "\${ORCHESTRATOR_DB_USER:}"
    password: "\${ORCHESTRATOR_DB_PASSWORD:}"
    driver-class-name: org.postgresql.Driver

orchestrator:
  async:
    core-pool-size: "\${ASYNC_CORE_POOL_SIZE:4}"
    max-pool-size: "\${ASYNC_MAX_POOL_SIZE:8}"
    queue-capacity: "\${ASYNC_QUEUE_CAPACITY:100}"
  storage:
    extractor-output-path: "\${STORAGE_PATH_EXTRACTOR_OUTPUT:\${orchestrator.storage.temp-base-dir}}"
    temp-base-dir: "\${TMP_FOLDER:\${java.io.tmpdir}}"

cipher:
  file-encrypt-enabled: "\${FILE_ENCRYPT_ENABLED:false}"
  file-encrypt-psw: "\${FILE_ENCRYPT_PSW:default_password}"
